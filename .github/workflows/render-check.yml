name: Render Quarto and check links
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook rendering support
        run: python -m pip install jupyter
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.6.43'
      - name: Render saved notebook outputs and pages
        run: quarto render
      - name: Check local links
        run: python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: quarto-docs
          path: docs
          include-hidden-files: true

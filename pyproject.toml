[project]
name = "stat386-eda-day2"
version = "0.1.0"
description = "Dimensionality reduction for question-driven EDA"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.5,<2",
  "ipykernel>=6.29,<8",
  "nbformat>=5.9,<6",
]

[project.optional-dependencies]
recompute = ["umap-learn>=0.5.7,<0.7", "phate>=1.0.11,<3"]
interactive = ["plotly>=5.20,<7"]

[tool.uv]
package = false
